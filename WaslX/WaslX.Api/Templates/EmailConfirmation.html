<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaslX Email Confirmation</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Segoe UI,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="background:#0b5fff;padding:24px;color:#ffffff;font-size:20px;font-weight:bold;">
                            WaslX
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;color:#333333;font-size:15px;line-height:1.6;">
                            <p>Hi {{name}},</p>
                            <p>Use the verification code below to confirm your email address. This code expires in 15 minutes.</p>
                            <p style="text-align:center;margin:32px 0;">
                                <span style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;color:#0b5fff;background:#eef3ff;padding:16px 24px;border-radius:8px;">{{otp_code}}</span>
                            </p>
                            <p>If you didn't create a WaslX account, you can safely ignore this email.</p>
                            <p>— The WaslX Team</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
