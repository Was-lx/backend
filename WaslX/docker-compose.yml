version: "3.9"

services:

  waslx-api:
    container_name: waslx-api

    build:
      context: .
      dockerfile: WaslX.Api/Dockerfile

    ports:
      - "8080:8080"

    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.4

    container_name: waslx-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: